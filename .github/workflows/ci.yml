name: Python CI

# 1. 觸發條件：當 push 到 main 分支，或有 Pull Request (PR) 針對 main 時觸發
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # 2. 執行環境：使用 GitHub 官方提供的 Ubuntu 最新版本虛擬機
    runs-on: ubuntu-latest

    steps:
    # 3. 步驟一：拉取倉庫的程式碼
    - name: Checkout repository
      uses: actions/checkout@v4

    # 4. 步驟二：在虛擬機上設定 Python 環境（版本 3.12）
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # 5. 步驟三：安裝依賴套件（pytest）
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 6. 步驟四：自動執行單元測試
    - name: Run tests with pytest
      env:
        PYTHONPATH: .
      run: |
        pytest

        pytest